name: newton2

# Isolated dev stack: every published port is bound to 127.0.0.1 only (no LAN/public
# exposure) on high, deliberately non-colliding ports, and every resource lives on its
# own "newton_net" network + "newton2" compose project — nothing here touches any other
# stack on the host.

networks:
  newton_net:
    name: newton2_net
  sandbox_net:
    name: newton2_sandbox_net
    internal: true  # no route to the internet or to any other service on newton_net —
                     # this is the load-bearing line for the code interpreter's isolation.
  artifact_net:
    name: newton2_artifact_net
    # Deliberately NOT internal, and that is the whole reason artifact-runner is a
    # separate container from sandbox-runner rather than a second endpoint on it: the
    # `opencode` agent it runs has to reach openrouter.ai to do anything at all. Adding
    # egress to sandbox_net instead would have given every piece of untrusted,
    # LLM-generated Python the code interpreter executes a live exfiltration path — see
    # services/artifact-runner/README.md's "Why this is a separate service". Still
    # separate from newton_net, so artifact-runner has no route to postgres/redis/
    # minio/keycloak; only `api` (which is on both) ever calls it.

volumes:
  newton_pgdata:
  newton_miniodata:
  newton_keycloakdata:
  newton_embedcache:
  newton_searxngdata:

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://newton:${POSTGRES_PASSWORD:-newton-dev-secret}@postgres:5432/newton
  REDIS_URL: redis://redis:6379/0
  ARQ_REDIS_URL: redis://redis:6379/1
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-newton}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-newton-dev-secret}
  # Two different addresses on purpose: KEYCLOAK_INTERNAL_URL is how the `api` container
  # itself talks to Keycloak over the Docker network (JWKS fetch, and how pytest's Direct
  # Grant login reaches it) -- always reachable regardless of hostname config. KEYCLOAK_ISSUER
  # is the token `iss` string to validate against, which is now KC_HOSTNAME above (the
  # browser-facing address), not the internal one -- these must be kept in sync manually.
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/newton
  KEYCLOAK_ISSUER: http://127.0.0.1:58180/realms/newton
  KEYCLOAK_AUDIENCE: newton-api
  EMBED_CACHE_DIR: /data/fastembed_cache
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.3-70b-instruct}
  SANDBOX_RUNNER_URL: http://sandbox-runner:8000
  ARTIFACT_RUNNER_URL: http://artifact-runner:8000
  SEARXNG_URL: http://searxng:8080
  LANGUAGETOOL_URL: http://languagetool:8010
  WHISPER_ASR_URL: http://whisper-asr:9000
  PIPER_TTS_URL: http://piper-tts:8000
  # Same Google Cloud OAuth client already used for Keycloak's Google login IdP (see
  # infra/keycloak/setup_google_idp.py) -- this is a separate, app-managed OAuth grant for
  # Classroom read scopes, not something Keycloak brokers. GOOGLE_CLASSROOM_REDIRECT_URI
  # (google_classroom_redirect_uri in Settings, defaulted in code) must be registered as
  # an *additional* Authorized redirect URI on that same OAuth client in Google Cloud
  # Console -- Console > APIs & Services > Credentials -- before /connect will work.
  GOOGLE_CLASSROOM_CLIENT_ID: ${GOOGLE_CLASSROOM_CLIENT_ID:-}
  GOOGLE_CLASSROOM_CLIENT_SECRET: ${GOOGLE_CLASSROOM_CLIENT_SECRET:-}
  # Fernet key encrypting Classroom OAuth tokens at rest (app/core/crypto.py) -- generate
  # with `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`.
  SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
  # Pro subscription tier ($15/mo, see app/routers/billing.py + app/services/billing.py) --
  # dormant until all three of these are set, same as every other optional integration
  # above. To activate, in your own Stripe Dashboard (https://dashboard.stripe.com):
  #   1. Products > add a Product with a recurring $15.00/month Price. Copy that Price's
  #      id (starts "price_...") into STRIPE_PRICE_ID_PRO below.
  #   2. Developers > API keys > copy the Secret key (starts "sk_...", NOT the publishable
  #      key -- the backend never needs the publishable one) into STRIPE_SECRET_KEY.
  #   3. Developers > Webhooks > add an endpoint at "<your public API URL>/billing/webhook"
  #      (e.g. https://api.yourdomain.com/billing/webhook -- must be reachable from the
  #      internet, so this step waits until the API is actually deployed somewhere public),
  #      subscribed to at least: checkout.session.completed, customer.subscription.updated,
  #      customer.subscription.deleted. Copy that endpoint's signing secret (starts
  #      "whsec_...") into STRIPE_WEBHOOK_SECRET below.
  # PRO_MONTHLY_CREDIT_CENTS is the tracked frontier-model spend (OpenRouter cost, in
  # cents) a Pro subscriber gets per billing period before quietly falling back to the
  # free-tier model -- deliberately less than the $15 price to preserve margin; tune
  # freely, no code change needed.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
  PRO_MONTHLY_CREDIT_CENTS: ${PRO_MONTHLY_CREDIT_CENTS:-600}
  # Optional error tracking (https://sentry.io) -- same dormant-until-configured shape as
  # every other optional integration above: empty by default, and app/core/sentry.py's
  # init_sentry() no-ops with no DSN set. To activate: create a Sentry project (Python/
  # FastAPI), copy its DSN (Settings > Client Keys (DSN)) into SENTRY_DSN below.
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: newton
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newton-dev-secret}
      POSTGRES_DB: newton
    volumes:
      - newton_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    networks: [newton_net]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newton -d newton"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:56379:6379"
    networks: [newton_net]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-newton}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-newton-dev-secret}
    volumes:
      - newton_miniodata:/data
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    networks: [newton_net]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # NOT --import-realm here: Keycloak's file-based realm import always runs with an
    # OVERWRITE_EXISTING strategy, so leaving --import-realm in the standing startup
    # command would DELETE AND RECREATE the entire "newton" realm from realm-newton.json
    # on every single container restart -- wiping every real account that ever signed up
    # (Google or email), not just resetting student1. Realm bootstrap is a ONE-TIME step:
    # on a genuinely fresh environment (empty `keycloak` Postgres database), run
    #   docker compose run --rm keycloak start-dev --import-realm
    # once, then start the stack normally from then on with this standing command. The
    # current live environment already has the realm imported; do not add --import-realm
    # back here.
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-newton-dev-secret}
      # `start-dev` defaults to an in-memory H2 database regardless of the data volume
      # below -- every container restart silently started from a totally empty DB, so
      # --import-realm re-created every user (student1, and any real signed-up/Google
      # account) with a brand-new random Keycloak user ID each time, orphaning all of
      # that user's chat history/memories (keyed by that ID) under the old row. Pointing
      # Keycloak at the already-provisioned `postgres` service makes its own realm/user
      # state a real, durable row set -- exactly the "own the data, no ephemeral state"
      # standard the rest of this stack already follows.
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: newton
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-newton-dev-secret}
      # This must be the address a BROWSER can actually reach, not Keycloak's own docker
      # hostname: Keycloak stamps this value into every link it generates itself -- the
      # hosted login page's form action, the "Sign in with Google" redirect, the `iss`
      # claim on every token. The old value ("http://keycloak:8080") is only resolvable
      # inside the Docker network, so once a real browser got redirected to Keycloak's
      # hosted UI (as the new Authorization Code + PKCE login flow does, unlike the old
      # direct password-grant call), every link on that page pointed nowhere the browser
      # could follow -- breaking both Google sign-in and plain username/password. Kept
      # STRICT (not relaxed to dynamic per-request hostnames, which would mean trusting
      # whatever Host header a request arrives with -- a real header-injection surface):
      # this is a value correction, matching the SSH-tunnel dev workflow documented in
      # infra/README.md, not a loosened check. services/api's KEYCLOAK_ISSUER below must
      # stay in sync with this exact value.
      KC_HOSTNAME: http://127.0.0.1:58180
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - newton_keycloakdata:/opt/keycloak/data
      - ./keycloak/realm-newton.json:/opt/keycloak/data/import/realm-newton.json:ro
    ports:
      - "127.0.0.1:58180:8080"
    networks: [newton_net]
    mem_limit: 900m

  api:
    build: ../services/api
    restart: unless-stopped
    environment: *api-env
    volumes:
      - newton_embedcache:/data/fastembed_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:58001:8000"
    # newton_net for postgres/redis/minio/keycloak/searxng; sandbox_net *only* to reach
    # sandbox-runner — sandbox-runner itself is never on newton_net (see below).
    # artifact_net likewise *only* to reach artifact-runner, which is never on
    # newton_net either. `api` is the single point that can talk to all three.
    networks: [newton_net, sandbox_net, artifact_net]
    mem_limit: 640m

  sandbox-runner:
    build: ../services/sandbox-runner
    restart: unless-stopped
    networks: [sandbox_net]  # never newton_net — must not reach postgres/redis/minio/keycloak
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    mem_limit: 300m
    pids_limit: 100
    # no ports: — only `api`, over sandbox_net, ever calls this

  artifact-runner:
    build: ../services/artifact-runner
    restart: unless-stopped
    networks: [artifact_net]  # never newton_net — must not reach postgres/redis/minio/keycloak
    environment:
      # The ONE secret this container gets, and the same key every other model call in
      # this app already uses (app/providers/registry.py) rather than a second, parallel
      # OpenRouter integration. `opencode` reads it directly (models.dev lists it as
      # OpenRouter's credential env var) — see services/artifact-runner/README.md.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      # Bigger than sandbox-runner's 128m (a Node runtime plus a per-request $HOME needs
      # the room), same noexec/nosuid/nodev hardening otherwise — Docker applies noexec
      # by default here, and a real opencode run was verified to work under it, so
      # nothing the agent writes into its scratch dir can ever be executed as a binary.
      - /tmp:size=512m,nosuid,nodev
    mem_limit: 1g
    pids_limit: 512
    # no ports: — only `api`, over artifact_net, ever calls this

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
      - newton_searxngdata:/var/cache/searxng
    networks: [newton_net]  # needs real internet egress to actually search — unlike
                             # sandbox-runner, this is deliberately not on sandbox_net
    mem_limit: 512m
    # no ports: — only `api`, over newton_net, ever calls this

  languagetool:
    image: erikvl87/languagetool:latest
    restart: unless-stopped
    networks: [newton_net]
    mem_limit: 700m
    # no ports: — only `api`, over newton_net, ever calls this

  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_MODEL: base
      ASR_ENGINE: faster_whisper
    networks: [newton_net]
    mem_limit: 1536m
    # no ports: — only `api`, over newton_net, ever calls this

  piper-tts:
    build: ../services/piper-tts
    restart: unless-stopped
    networks: [newton_net]
    mem_limit: 512m
    # no ports: — only `api`, over newton_net, ever calls this

  worker:
    build: ../services/api
    restart: unless-stopped
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment: *api-env
    volumes:
      - newton_embedcache:/data/fastembed_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [newton_net]
    mem_limit: 640m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    ports:
      - "127.0.0.1:58080:80"
    networks: [newton_net]
    mem_limit: 64m
