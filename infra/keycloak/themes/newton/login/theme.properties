# Newton's re-skin of Keycloak's own default login theme — Keycloak 26's "keycloak.v2",
# built on PatternFly v5 (pf-v5-c-* classes), confirmed by inspecting the real rendered
# page before writing newton.css. NOT `parent=keycloak`: in Keycloak 26 that name
# resolves to the OLDER classic PatternFly v3/v4 "login-pf" theme (a completely
# different, unrelated theme, not an ancestor of keycloak.v2) -- a first attempt at this
# used `parent=keycloak` and it silently inherited that old theme's templates/CSS
# instead, so every pf-v5-c-* selector in newton.css matched nothing and the page
# rendered as that old theme's own dark banner/default-blue-button look, not Newton's and
# not even an error -- caught only by actually looking at a real screenshot and then the
# real <link rel="stylesheet"> list, not by anything that would have failed loudly.
# `parent=keycloak.v2` is the fix: same templates/structure as the real page, so this
# theme only ever touches colors/fonts/spacing via CSS, never structure.
parent=keycloak.v2
import=common/keycloak
styles=css/newton.css
