[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
markers =
    live_smoke: hits a real external service over the network (real Open Library, real
        standalone SearXNG, real OpenRouter catalog, real self-hosted sandbox-runner/
        whisper-asr/piper-tts, ...) rather than a mock/fixture -- excluded from the
        hermetic CI run (.github/workflows/test.yml runs `-m "not live_smoke"`) and
        meant to be run manually (or via a separate scheduled workflow) against the
        real deployed stack. See ROADMAP.md's Phase 7 "Decouple the test suite from the
        shared live dev box" entry.
