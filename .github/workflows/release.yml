name: Release desktop app

# Produces real signed Tauri release artifacts (Windows/macOS/Linux) and publishes them
# as a GitHub Release, including the `latest.json` manifest tauri-plugin-updater polls
# at the endpoint already embedded in apps/desktop/src-tauri/tauri.conf.json
# (https://github.com/SRock44/Newton2/releases/latest/download/latest.json). See
# WEBSITE-ROADMAP.md Phase 2 -- the app-side updater config (plugin, endpoint, embedded
# minisign pubkey, `updater:default` capability) was already fully wired before this
# workflow existed; this is purely the producing side.
#
# Update-artifact signing (the minisign keypair tauri-plugin-updater verifies against
# the embedded pubkey) is separate from OS-level code signing (Apple notarization,
# Windows Authenticode/EV certs). This workflow does the former via
# TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] -- required for the updater to accept an update
# at all. It does NOT attempt Apple notarization or a Windows EV cert (no Apple
# Developer / EV cert secrets exist in this repo yet); until those are added, the
# Windows/macOS installers this produces are real and updater-verifiable but will still
# show an OS "unknown publisher" warning on first run. That's a separate, later,
# explicitly-scoped piece of work, not silently assumed done here.
#
# Trigger: push a tag matching `desktop-v*` (e.g. `desktop-v0.1.0`) once
# src-tauri/tauri.conf.json's `version` has been bumped to match, or run manually via
# workflow_dispatch for a test/verification release.

on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch: {}

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/desktop

jobs:
  publish-tauri:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon (M1+)
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # Intel
            args: '--target x86_64-apple-darwin'
          # ubuntu-22.04, not ubuntu-latest -- matches .github/workflows/test.yml's
          # tauri-build job comment: this is the older-glibc runner Tauri's own v2 CI
          # docs call for, so the AppImage this produces stays compatible with older
          # user systems (a newer-glibc build silently fails to run on them).
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Same package list as test.yml's tauri-build job, arrived at there by actually
      # running this in CI and watching what pkg-config probes pulled in (webkit2gtk's
      # own dependency chain needs libpipewire-0.3-dev even though this app never uses
      # PipeWire) -- kept identical here rather than re-derived.
      - name: Install Tauri Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libpipewire-0.3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifact (.sig files) against the minisign keypair whose
          # public half is already embedded in tauri.conf.json's `plugins.updater.pubkey`
          # -- this is what makes tauri-plugin-updater accept an update instead of
          # rejecting it as untrusted. Both secrets must be set on this repo
          # (`gh secret set TAURI_SIGNING_PRIVATE_KEY` / `..._PASSWORD`) before this
          # workflow can produce a real signed release; until then this job will fail at
          # this step, which is the correct, honest failure mode -- not a workflow bug.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: 'Newton Desktop v__VERSION__'
          releaseBody: |
            See the assets below to download and install this version. Existing
            installs will also be offered this update automatically.
          # Published for real, not left as a draft -- tauri-plugin-updater's endpoint
          # (github.com/.../releases/latest/download/latest.json) only resolves against
          # a repo's actual "latest" published release, never a draft.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
